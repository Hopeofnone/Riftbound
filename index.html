<!doctype html><html lang="en"><head>
<script>window.HOSTED_ART="pack";window.ART_PACK_VERSION="2026-10-08"</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Rift Table · Riftbound rules engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>/* =========================================================
   Rift Table — tactical interface
   Slate field, bone type, rift-red for "act now", cyan for you.
   Angular cuts instead of rounded cards; one loud element: the call-out band.
   ========================================================= */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--slate:#0F1923;--deep:#0B131B;--panel:#17232E;--panel2:#1E2C38;--line:#2E3E4B;--line2:#3D5060;
--bone:#ECE8E1;--mut:#8D99A3;--dim:#5E6B76;--red:#FF4655;--red2:#C9303D;--cyan:#3EE0CF;--cyan2:#1FA89A;--gold:#F0C86A;
--fury:#E3463F;--calm:#45B36F;--mind:#4A8FE0;--body:#EE9233;--chaos:#9B5BD6;--order:#E9CC4E;--colorless:#A3ADB2;
--cardbg:#ECE8E1;--cardink:#14202A;--cw:clamp(50px,min(5vw,8.6vh),90px);--cut:10px;
--disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
:root{--fbody:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
:root{color-scheme:dark}
:root[data-theme="dark"]{--slate:#0F1923}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--slate);color:var(--bone);font:14px/1.45 var(--fbody);height:100%;-webkit-font-smoothing:antialiased}
#app{height:100%}
h1,h2,h3,h4{font-family:var(--disp);font-weight:700;letter-spacing:.02em;margin:0}
.cut{clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}

/* ---------- controls ---------- */
button{font:600 .9rem/1.1 var(--fbody);color:var(--bone);background:var(--panel2);border:1px solid var(--line2);padding:.5rem .8rem;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px));transition:background .12s,border-color .12s,color .12s}
button:hover:not(:disabled){background:#26394A;border-color:var(--bone)}
button:disabled{opacity:.35;cursor:not-allowed}
button.on{border-color:var(--cyan);color:var(--cyan)}
button.go{background:var(--red);border-color:var(--red);color:#fff;font-family:var(--disp);font-size:1.05rem;letter-spacing:.04em;padding:.55rem 1.1rem}
button.go:hover:not(:disabled){background:#ff5c69;border-color:#ff5c69}
button.go.big{font-size:1.35rem;padding:.75rem 2rem}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
kbd{font:600 .7em var(--fbody);opacity:.75;border:1px solid currentColor;padding:0 .3em;margin-left:.45em;border-radius:2px}
select,input,textarea{font:inherit;color:var(--bone);background:var(--deep);border:1px solid var(--line);border-radius:0;padding:.45rem .55rem;max-width:100%}
textarea{width:100%;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
label{display:flex;flex-direction:column;gap:.3rem;margin:.55rem 0;color:var(--mut);font-size:.88rem}label.cb{flex-direction:row;align-items:center;gap:.5rem;color:var(--bone)}
.hint{color:var(--mut);font-size:.85rem}.warn{color:var(--red)}.ok{color:var(--cyan)}
.row{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin:.45rem 0}.col{display:flex;flex-direction:column;gap:.4rem}.lbl{color:var(--mut);font-size:.82rem}
.btn{display:inline-flex;align-items:center;font:600 .9rem var(--fbody);background:var(--panel2);border:1px solid var(--line2);padding:.5rem .8rem;cursor:pointer;color:var(--bone);clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}
.btn:hover{border-color:var(--bone)}.btn.sm{padding:.3rem .6rem;font-size:.8rem}

/* ---------- setup ---------- */
.setupwrap{height:100%;overflow:auto;background:
  linear-gradient(115deg,transparent 0 62%,rgba(255,70,85,.07) 62% 62.4%,transparent 62.4%),
  linear-gradient(115deg,transparent 0 66%,rgba(255,70,85,.05) 66% 70%,transparent 70%),var(--slate)}
.hero{padding:2.2rem 1.6rem .4rem;max-width:1200px;margin:auto;display:flex;align-items:flex-end;gap:1.2rem;flex-wrap:wrap}
.hero h1{font-size:clamp(3rem,7vw,5.4rem);line-height:.86;letter-spacing:-.01em;text-transform:uppercase}
.hero h1::after{content:"";display:block;width:3.2rem;height:5px;background:var(--red);margin-top:.5rem}
.hero p{margin:0 0 .5rem;color:var(--mut);font-size:1rem;max-width:42ch}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:1.1rem;max-width:1200px;margin:auto;padding:1rem 1.6rem}
.deckp{background:var(--panel);border-left:3px solid var(--line2);padding:1.1rem 1.2rem;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.deckp:first-child{border-left-color:var(--cyan)}.deckp:nth-child(2){border-left-color:var(--red)}
.deckp h2{font-size:1.9rem;line-height:1;margin-bottom:.5rem;text-transform:uppercase}
.seg{display:inline-flex;gap:0;border:1px solid var(--line2)}.seg button{clip-path:none;border:0;background:transparent}.seg button.on{background:var(--bone);color:var(--slate)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}.chip{font-size:.82rem;padding:.25rem .6rem}
.rn{flex-direction:row;align-items:center;gap:.45rem;color:var(--bone)}.rn input{width:4.4rem}
.probs{margin:.55rem 0 0;padding-left:1.1rem;color:var(--red);font-size:.86rem}.probs .ok{color:var(--cyan);list-style:none;margin-left:-1.1rem}
.opts{max-width:1200px;margin:0 auto 2.4rem;padding:.6rem 1.6rem;display:flex;flex-wrap:wrap;gap:1rem 1.6rem;align-items:center}
.opts input[type=number]{width:5rem}
.opts>button.go{margin-left:auto;font-size:1.5rem;padding:.8rem 2.6rem}
.art{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

/* ---------- icons ---------- */
.ic{display:inline-flex;align-items:center;justify-content:center;vertical-align:-.2em;margin:0 .06em}
.ic.en{min-width:1.35em;height:1.35em;border-radius:50%;background:#22323F;color:#fff;font-size:.78em;font-weight:700;padding:0 .2em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.ic.pw{width:1.05em;height:1.05em;transform:rotate(45deg) scale(.78);background:var(--dc,var(--colorless))}
.ic.pw.any{background:conic-gradient(var(--fury),var(--body),var(--order),var(--calm),var(--mind),var(--chaos),var(--fury))}
.d-fury{--dc:var(--fury)}.d-calm{--dc:var(--calm)}.d-mind{--dc:var(--mind)}.d-body{--dc:var(--body)}.d-chaos{--dc:var(--chaos)}.d-order{--dc:var(--order)}.d-colorless{--dc:var(--colorless)}
.ic.mt{font-size:.7em;font-weight:800;background:var(--gold);color:#1a1a1a;padding:0 .3em}.ic.ex{font-size:.9em}.kw{font-weight:700}

/* ---------- card face ---------- */
.cf{position:relative;width:var(--cw);aspect-ratio:744/1039;border-radius:calc(var(--cw)*.05);overflow:hidden;background:var(--cardbg);color:var(--cardink);font-size:calc(var(--cw)*.105);line-height:1.1;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.cf.big{--cw:min(250px,100%);font-size:13px}
.cf.land{aspect-ratio:1038/744;width:calc(var(--cw)*1.395)}.cf.land.big{width:100%;max-width:340px}.cf.art img{image-rendering:auto}
.cf.art img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cf.txt{border-top:calc(var(--cw)*.07) solid var(--dc,var(--colorless));padding:.35em .4em}
.cf .ch{display:flex;justify-content:space-between;align-items:center}
.cn{font-family:var(--disp);font-weight:700;font-size:1.2em;margin-top:.15em;line-height:1}.cs{font-style:italic;opacity:.7}.ct{opacity:.6;font-size:.9em}.ck{margin-top:.25em;font-weight:600;font-size:.9em;color:#2B5878}.cx{margin-top:.4em}
.mg{display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;background:var(--gold);color:#141414;font:800 1em var(--disp);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);padding:0 .2em}
.mg.mod{background:var(--cyan);color:#06221F}
.cf.art .mg{position:absolute;right:4%;bottom:3%;font-size:calc(var(--cw)*.17);min-width:1.9em;height:1.9em}
.bds{position:absolute;left:4%;bottom:4%;display:flex;flex-wrap:wrap;gap:2px;max-width:70%}
.bd{font:700 max(9px,calc(var(--cw)*.11))/1.3 var(--fbody);padding:0 .35em;background:#22323F;color:#fff;font-style:normal;text-transform:lowercase}
.bd.dmg{background:var(--red);color:#fff}.bd.bf{background:var(--gold);color:#1a1205}.bd.st{background:#7A5CE8}.bd.at{background:var(--fury)}.bd.df{background:var(--mind)}
.cf.back{background:
  linear-gradient(135deg,transparent 46%,rgba(255,70,85,.55) 46% 54%,transparent 54%),
  repeating-linear-gradient(45deg,#1A2731 0 5px,#16222B 5px 10px);border:1px solid #2F414F}
.cf.back::after{content:"";position:absolute;inset:22% 22%;border:2px solid rgba(236,232,225,.25);transform:rotate(45deg)}

/* ---------- table frame ---------- */
.game{display:grid;grid-template-columns:58px minmax(0,1fr) 118px 330px;height:100vh;height:100dvh;background:var(--slate)}
.lcol{display:flex;flex-direction:column;align-items:center;padding:.6rem 0;gap:.4rem;background:var(--deep);border-right:1px solid var(--line)}
.lcol .sp{flex:1}.lcol .who{writing-mode:vertical-rl;transform:rotate(180deg);font:700 .95rem var(--disp);letter-spacing:.06em;text-transform:uppercase}
.lcol .who.me{color:var(--cyan)}.lcol .who.op{color:var(--red)}
.track{display:grid;grid-template-columns:repeat(2,24px);gap:3px 4px;padding:0 2px}
.track i{display:flex;align-items:center;justify-content:center;width:24px;height:24px;font:700 .8rem var(--disp);font-style:normal;color:var(--dim);border:1px solid var(--line);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:var(--panel)}
.track i:nth-child(odd){grid-column:1}.track i:nth-child(even){grid-column:2;transform:translateY(55%)}
.track i.past{color:var(--bone);background:var(--panel2)}
.track.tme i.past{background:rgba(62,224,207,.25)}.track.top i.past{background:rgba(255,70,85,.25)}
.track.tme i.on{background:var(--cyan);color:#05211E}.track.top i.on{background:var(--red);color:#fff}
.tbl{position:relative;display:flex;flex-direction:column;gap:.4rem;padding:.5rem .6rem;min-width:0;min-height:0;overflow:hidden;
  background:radial-gradient(ellipse 80% 60% at 50% 50%,#142231,var(--slate) 80%)}
.tbl::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 38px,rgba(255,255,255,.012) 38px 39px)}
.hand{position:relative;display:flex;gap:.35rem;justify-content:center;min-height:calc(var(--cw)*.55);flex:none;z-index:1}
.hand.op{--cw:clamp(40px,3.5vw,60px);margin-top:calc(var(--cw)*-.5)}.hand.me{padding-top:.15rem}
.hc{transition:transform .12s;cursor:grab}.hand.me .hc:hover{transform:translateY(-12px)}
.hc.picked{transform:translateY(-14px)}.hc.picked .cf{outline:3px solid var(--red);outline-offset:2px}
.hc.pbx .cf{outline:2px dashed var(--gold);outline-offset:2px}
.row-p{position:relative;z-index:1;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:.6rem;align-items:center;flex:none;padding:.3rem .4rem;border-left:3px solid transparent}
.row-p.me{border-left-color:var(--cyan)}.row-p.op{--cw:clamp(48px,4.5vw,80px);border-left-color:var(--red)}
.row-p.turn{background:linear-gradient(90deg,rgba(255,255,255,.035),transparent 40%)}
.stack{display:flex;gap:.35rem}
.pile{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;--cw:clamp(38px,3.2vw,54px);padding:0;background:none;border:0;clip-path:none;cursor:pointer}
.pile .pface{display:block;width:var(--cw);aspect-ratio:744/1039;border:1px solid var(--line2);background:repeating-linear-gradient(45deg,#1A2731 0 5px,#16222B 5px 10px);overflow:hidden}
.pile.face .pface{background:var(--deep)}.pile .pface img{width:100%;height:100%;object-fit:cover;opacity:.75}
.pile b{position:absolute;top:24%;left:50%;transform:translateX(-50%);background:var(--slate);border:1px solid var(--line2);padding:0 .4em;font:700 1rem var(--disp)}
.pile .pl{font-size:.68rem;color:var(--mut);white-space:nowrap}
.pile:hover .pface{border-color:var(--bone)}
.rz{display:flex;flex-direction:column;gap:.3rem;max-width:min(30vw,310px)}.runes{display:flex;flex-wrap:wrap;gap:4px}
.rune{position:relative;--rw:clamp(26px,2.3vw,40px);width:var(--rw);height:calc(var(--rw)*1.4);background:var(--dc);border:1px solid rgba(0,0,0,.4);overflow:visible;cursor:pointer;transition:transform .12s,filter .12s}
.rune img{width:100%;height:100%;object-fit:cover;display:block}
.rune .rg{display:flex;align-items:center;justify-content:center;height:100%;font:700 1rem var(--disp);color:rgba(0,0,0,.55)}
.rune.exh{transform:rotate(90deg) scale(.8);filter:grayscale(.7) brightness(.6)}
.rune .racts{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);display:none;gap:2px;z-index:5}
.rune:hover .racts,.rune:focus-within .racts{display:flex}
.rune .racts button{padding:.2rem .3rem;clip-path:none;background:var(--deep);border-color:var(--line2)}
.rune.exh .racts{transform:translate(-50%,-100%) rotate(-90deg)}
.pool{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--mut)}.pool b{color:var(--bone);font:700 1.1rem var(--disp);margin-left:.15rem}
.pool .lbl{display:none}
.base{position:relative;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;min-height:calc(var(--cw)*1.4);padding:.35rem .5rem .35rem 1.4rem;background:rgba(255,255,255,.02);border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.zl{position:absolute;left:.25rem;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;font:700 .7rem var(--disp);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.lz{display:flex;gap:.35rem}
.bfs{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:.6rem;min-height:0}
.bf{container-type:size;position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);min-height:0;border:1px solid var(--line2);overflow:hidden;isolation:isolate;
  background:var(--panel);clip-path:polygon(22px 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%,0 22px)}
.bf::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--bfa,none) 50% 34%/auto 215% no-repeat;filter:saturate(.95)}
@container (min-aspect-ratio:2/1){}
.bf::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(11,19,27,.82) 0%,rgba(11,19,27,.45) 34%,rgba(11,19,27,.3) 50%,rgba(11,19,27,.45) 66%,rgba(11,19,27,.85) 100%)}
.bf.ctl-me{border-color:rgba(62,224,207,.6)}.bf.ctl-op{border-color:rgba(255,70,85,.6)}
.bf.cont{border-color:var(--gold)}.bf.live{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.bside{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;align-content:center;padding:.4rem;min-height:calc(var(--cw)*1.15)}
.bmid{display:flex;align-items:center;justify-content:center;gap:.7rem;padding:.25rem .6rem;background:rgba(11,19,27,.72);border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
.bname{display:flex;flex-direction:column;align-items:center;gap:0;background:none;border:0;clip-path:none;padding:.15rem .6rem;text-align:center}
.bname b{font:700 clamp(1rem,1.4vw,1.35rem)/1 var(--disp);letter-spacing:.03em;text-transform:uppercase}
.bname .ctrl{font-size:.72rem;color:var(--mut)}.ctl-me .bname .ctrl{color:var(--cyan)}.ctl-op .bname .ctrl{color:var(--red)}
.bname:hover:not(:disabled){background:rgba(255,255,255,.06)}
.bmt{font:700 1.4rem/1 var(--disp);min-width:2.2rem;text-align:center;padding:.1rem .3rem;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:var(--panel2)}
.bmt.me{color:var(--cyan)}.bmt.op{color:var(--red)}
.live-tag{background:var(--red);color:#fff;font:700 .72rem var(--disp);letter-spacing:.08em;text-transform:uppercase;padding:.08rem .45rem}
.bf.cont .live-tag{background:var(--gold);color:#1b1407}.bf.live .live-tag{background:var(--red);color:#fff}
.pc{position:relative;cursor:pointer;transition:transform .12s}
.pc.exh{transform:rotate(90deg) scale(.86);margin:0 calc(var(--cw)*.18)}.pc.exh .cf{filter:brightness(.7)}
.pc.sel .cf{outline:2px solid var(--bone);outline-offset:2px}
.pc.cand .cf,.hc.cand .cf,.ci.cand{outline:3px solid var(--red);outline-offset:2px;animation:pulse 1.1s ease-in-out infinite}
.pc.picked .cf{outline:3px solid var(--cyan);outline-offset:2px}
@keyframes pulse{0%,100%{outline-color:var(--red)}50%{outline-color:rgba(255,70,85,.35)}}
.att{font-size:.68rem;background:var(--panel2);border-left:2px solid var(--gold);padding:.05rem .3rem;margin-top:2px;max-width:var(--cw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.lg.exh{filter:grayscale(.8) brightness(.6)}
.ghost,.ghost *{transition:none!important;animation:none!important}.ghost{position:fixed;left:0;top:0;margin:0;pointer-events:none;z-index:1000;opacity:.92;will-change:transform;box-shadow:0 10px 24px rgba(0,0,0,.5)}
[data-drag]{touch-action:none;-webkit-user-select:none;user-select:none}body.dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}body.dragging *{cursor:grabbing!important}
body.dragging [data-drop].droppable:not(.tbl){outline:2px dashed rgba(62,224,207,.55);outline-offset:-4px}body.dragging [data-drop].over:not(.tbl){outline:3px solid var(--cyan);outline-offset:-4px;background-color:rgba(62,224,207,.12)}body.dragging [data-drop].dropok{outline:2px dashed var(--cyan);outline-offset:-4px}
.ccol{display:flex;flex-direction:column;gap:.4rem;padding:.6rem .5rem;justify-content:center;background:var(--deep);border-left:1px solid var(--line)}
.ccol button{font-size:.82rem}

/* ---------- call-out band (the one loud element) ---------- */
.veil{position:absolute;inset:0;z-index:20;background:rgba(9,15,21,.62);backdrop-filter:blur(2px)}
.callout{position:absolute;left:.6rem;right:.6rem;z-index:30;pointer-events:none}
.callout .cbar{pointer-events:auto;display:flex;align-items:stretch;background:var(--deep);border:1px solid var(--line2);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.callout.dock{position:relative;left:auto;right:auto;flex:none;z-index:15}
.callout.dock .cbar{background:var(--deep);border-color:var(--red);box-shadow:0 0 0 1px rgba(255,70,85,.25),0 10px 30px rgba(0,0,0,.35)}
.callout.dock.me .cbar{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(62,224,207,.2),0 10px 30px rgba(0,0,0,.35)}
.callout.dock .cmain{padding:.5rem 1rem}.callout.dock .cacts{padding:.45rem .8rem}
.callout.dock.quiet .cbar{background:rgba(11,19,27,.6);border-color:var(--line);box-shadow:none}
.callout.dock.quiet .cmain{display:flex;align-items:baseline;gap:.4rem 1rem;flex-wrap:wrap}.callout.dock.quiet .ckick{width:100%;margin:0}.callout.dock.quiet p{margin:0;font-size:.82rem}
.callout.center{top:50%;transform:translateY(-50%)}
.callout.center .cbar{min-height:9rem}
.callout .ctag{flex:none;width:10px;background:var(--red);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),0 100%)}
.callout .ckick{display:block;font:700 .8rem var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:.15rem}.callout.me .ckick{color:var(--cyan)}.callout.dock.quiet .ckick{color:var(--dim)}
.callout.me .ctag{background:var(--cyan);color:#06221F}
.callout.dock.quiet .ctag{background:var(--panel2);color:var(--mut)}
.callout .cmain{flex:1;padding:.75rem 1.2rem;min-width:0}
.callout h2{font-size:clamp(1.6rem,2.6vw,2.6rem);line-height:.95;text-transform:uppercase}
.callout.dock h2{font-size:clamp(1.3rem,2vw,2rem)}

// ===================== RUNTIME v2: statics, events, effect runner =====================
function abil(cid){const R=cardFx(cid);return{acts:R.acts,other:R.bad,trig:R.trig}}
const TOKENCARD=n=>CARDS.find(c=>(c.st||[]).includes('Token')&&c.t!=='Battlefield'&&c.n.toLowerCase()===n.toLowerCase())||CARDS.find(c=>(c.st||[]).includes('Token')&&c.n.toLowerCase().startsWith(n.toLowerCase()));
function TS(pi){G.ts=G.ts||[{},{}];return G.ts[pi]}
const tagsOf=o=>(BYID[effCid(o)].g||[]).map(x=>x.toLowerCase()).concat(o.extraTag?[o.extraTag]:[]);
const isTokenObj=o=>(BYID[o.cid].st||[]).includes('Token');
function baseMight(o){const c=C(o);const bm=o.baseSet&&o.baseSet.turn===G.turn?o.baseSet.v:(o.gm!=null?o.gm:(c.m??0));return Math.max(0,bm+(o.buff?1:0)+(o.mods||[]).reduce((a,x)=>a+x.v,0))}
function hereOf(ctx){if(ctx.bf!=null)return ctx.bf;if(ctx.defBF!=null&&ctx.useDef)return ctx.defBF;const o=ctx.src&&obj(ctx.src);if(o)return o.loc;return ctx.loc??null}
function matchT(t,o,ctx){if(!o)return false;if(t.kind!=='any'&&o.kind!==t.kind)return false;const pi=ctx.pi;
  if(t.side==='own'&&o.ctrl!==pi)return false;if(t.side==='opp'&&o.ctrl===pi)return false;
  if(t.where==='movedTF'){if(!(o.loc!=='base'&&(o.loc===ctx.there||o.loc===ctx.moveTo)))return false}
  if(t.where==='notHere'){const h=hereOf(ctx);if(o.loc===h)return false}
  if(t.where==='tokloc'){const tk=ctx.tok&&obj(ctx.tok);if(!tk||o.loc!==tk.loc||o.iid===tk.iid)return false}
  if(t.where==='itloc'){const it=ctx.it&&obj(ctx.it[0]);const L=it?it.loc:ctx.itLoc;if(L==null||o.loc!==L)return false}
  const here=hereOf(ctx);if(t.where==='bf'&&o.loc==='base')return false;if(t.where==='base'&&o.loc!=='base')return false;if(t.where==='here'&&(here==null||o.loc!==here))return false;
  if(t.where==='combat'&&!(G.showdown&&G.showdown.combat&&o.loc===G.showdown.bf))return false;
  if(t.other&&o.iid===ctx.src)return false;
  if(o.kind==='unit'){const m=might(o);if(t.maxM!=null&&m>t.maxM)return false;if(t.minM!=null&&m<t.minM)return false;
    if(t.lessThan){const ref=t.lessThan==='me'?obj(ctx.src):ctx.it&&obj(ctx.it[0]);if(ref&&m>=might(ref))return false}}
  if(t.maxCost!=null&&(BYID[o.cid].e||0)>t.maxCost)return false;if(t.maxCostMyMight){const me=obj(ctx.src);if(!me||(BYID[o.cid].e||0)>might(me))return false}
  for(const f of t.f||[]){if(f==='buffed'&&!o.buff)return false;if(f==='exhausted'&&!o.ex)return false;if(f==='ready'&&o.ex)return false;if(f==='stunned'&&!o.stun)return false;if(f==='damaged'&&!o.dmg)return false;
    if(f==='token'&&!isTokenObj(o))return false;if(f==='non-token'&&isTokenObj(o))return false;if(f==='champion'&&!(BYID[o.cid].st||[]).includes('Champion'))return false;
    if(f==='attacking'&&role(o)!=='att')return false;if(f==='defending'&&role(o)!=='def')return false;if(f==='incombat'&&!role(o))return false;
    if(f==='tag:equipment'){if(!(tagsOf(o).includes('equipment')||cardFx(effCid(o)).equip))return false}else if(f.startsWith('tag:')&&!tagsOf(o).includes(f.slice(4)))return false;if(f.startsWith('dom:')&&!BYID[o.cid].d.includes(f.slice(4)))return false;if(f.startsWith('notag:')&&tagsOf(o).includes(f.slice(6)))return false;if(f==='moved'&&o.movesTurn!==G.turn)return false;if(f==='bombs'&&BYID[o.cid].n!=='Bomb')return false;if(f==='notTok'&&o.iid===ctx.tok)return false;if(f==='namedTag'){const me=obj(ctx.src);if(!me||!me.named||!tagsOf(o).includes(me.named))return false}if(f==='equipped'&&!G.objs.some(g=>g.attachedTo===o.iid))return false;if(f==='myname'){const me=obj(ctx.src);if(!me||C(o).n!==C(me).n||o.iid===me.iid)return false}if(f==='empowered'&&!o.emp)return false;if(f.startsWith('tags:')&&!f.slice(5).split('|').some(x=>tagsOf(o).includes(x)))return false;if(f.startsWith('no:')&&kwOf(o)[cap(f.slice(3))])return false;if(f.startsWith('has:')&&!kwOf(o)[cap(f.slice(4))])return false}
  return true}

function untargetable(o,pi){return o.ctrl!==pi&&(statFor(o).some(s=>s.t==='untargetable')||o.flags&&o.flags.untarget===G.turn)}
function cands(st,ctx){const t=st.t;if(!t)return[];if(t.self){const o=obj(ctx.src);return o?[o.iid]:[]}if(t.it)return(ctx.it||[]).filter(i=>obj(i));if(t.it2)return(ctx.it2||[]).filter(i=>obj(i));
  return G.objs.filter(o=>!o.attachedTo||t.kind!=='unit').filter(o=>matchT(t,o,ctx)&&!(untargetable(o,ctx.pi)&&!t.all)&&!((ctx.chosen||[]).includes(o.iid)&&st.k==='choose2')).map(o=>o.iid)}
// ---------- conditions ----------
function condOK(c,ctx){if(!c)return true;const pi=ctx.pi;const me=obj(ctx.src);const it=ctx.it&&obj(ctx.it[0]);
  switch(c.k){
  case'control':return G.objs.some(o=>o.ctrl===pi&&(!c.other||o.iid!==ctx.src)&&matchT({...c.t,side:'own',where:'any',other:false},o,ctx));
  case'facedown':return G.bfs.some(b=>b.hidden.some(h=>h.pi===pi));
  case'runes':{const n=P(pi).runes.length;return c.op==='<='?n<=c.n:n>=c.n}
  case'state':{const o=c.who==='me'?me:it;if(!o)return false;return c.st==='empowered'?!!o.emp:c.st==='buffed'?!!o.buff:c.st==='stunned'?!!o.stun:c.st==='exhausted'?!!o.ex:c.st==='attacking'?role(o)==='att':c.st==='defending'?role(o)==='def':c.st==='mighty'?might(o)>=5:false}
  case'side':return ctx.itCtrl!=null&&(c.side==='own'?ctx.itCtrl===pi:ctx.itCtrl!==pi);
  case'itmax':return ctx.itMight!=null&&ctx.itMight<=c.n;
  case'legion':return(ctx.legion??G.played[pi]>=1);
  case'oppNear':return P(opp(pi)).points>=G.opts.victory-c.n;
  case'unitsHere':{const h=hereOf(ctx);return at(h).filter(u=>u.ctrl===pi).length>=c.n}
  case'unitsBase':return G.objs.filter(o=>o.kind==='unit'&&o.ctrl===pi&&o.loc==='base'&&o.iid!==ctx.src).length>=c.n;
  case'paid':return!!ctx.paid;case'did':return!!ctx.did;case'killed':return!!ctx.killed;
  case'oppBF':return G.bfs.some(b=>b.ctrl===opp(pi));
  case'stat':return(TS(c.opp?opp(pi):pi)[c.key]||0)>=c.n||c.key==='enemyDied'&&(TS(opp(pi)).died||0)>=c.n;
  case'aloneIt':return it&&at(it.loc).filter(u=>u.ctrl===it.ctrl).length===1;
  case'nth':return G.played[pi]===c.n;
  case'atBF':return me&&me.loc!=='base';
  case'alone':return me&&role(me)&&at(me.loc).filter(u=>u.ctrl===me.ctrl).length===1;
  case'inShowdown':return me&&G.showdown&&G.showdown.bf===me.loc;
  case'beginning':return G.phase==='start';case'exactOtherHere':{const h=hereOf(ctx);const n=at(h).filter(u=>u.ctrl===pi&&u.iid!==ctx.src).length;return c.min?n>=c.min:n===c.n}
  case'ctrlBF':return ctx.bf!=null&&G.bfs[ctx.bf].ctrl===pi;
  case'pickedTag':return!!ctx.pickedCid&&(BYID[ctx.pickedCid].g||[]).some(t=>['bird','cat','dog','poro'].includes(t.toLowerCase()));
  case'trashTagged':return P(pi).trash.some(x=>{const c=BYID[x.cid];return c.t==='Unit'&&(c.e||0)<=2&&(c.p||0)<=1&&(c.g||[]).some(t=>['bird','cat','dog','poro'].includes(t.toLowerCase()))});
  case'and':return condOK(c.a,ctx)&&condOK(c.b,ctx);case'fromHidden':return!!ctx.fromHidden;
  case'bfExactTwo':return G.bfs.some((b,i)=>b.ctrl===pi&&at(i).length===2);
  case'allTags':return['bird','cat','dog','poro'].every(tg=>G.objs.some(o=>o.ctrl===pi&&o.kind==='unit'&&tagsOf(o).includes(tg)));
  case'showed':return!!ctx.shown;case'selfNotNear':return P(pi).points<G.opts.victory-c.n;
  case'exactOwnAtIt':{const it=ctx.it&&obj(ctx.it[0]);const L=it?it.loc:ctx.itLoc;return L!=null&&L!=='base'&&at(L).filter(u=>u.ctrl===pi).length===c.n}
  case'unitsAtBF':{const h=hereOf(ctx);return h!=null&&h!=='base'&&at(h).length>=c.n}case'deployHere':return me&&G.objs.some(g=>g.ctrl===pi&&g.kind==='gear'&&g.loc===me.loc&&me.loc!=='base'&&(C(g).kw.Deploy||/\[Deploy\]/.test(C(g).x||'')));
  case'movedTwice':return me&&me.movesTurn===G.turn&&(me.moves||0)>=2;case'gutter':return P(pi).hand.length===c.h&&G.objs.filter(o=>o.kind==='unit'&&o.ctrl===pi&&o.loc!=='base').length===c.u;
  case'excess':return G.excess&&G.excess.turn===G.turn&&(G.excess[pi]||0)>=c.n;
  case'stunnedEnemyHere':{const h=hereOf(ctx);return at(h).some(u=>u.ctrl!==pi&&u.stun)}case'noOtherUnits':return!G.objs.some(o=>o.kind==='unit'&&o.ctrl===pi&&o.iid!==ctx.src);
  case'notMyTurn':return G.active!==pi;case'myTurn':return G.active===pi;case'runeDeckEmpty':return!P(pi).runeDeck.length;
  case'othersAtMe':return me&&G.objs.filter(o=>o.ctrl===pi&&o.iid!==me.iid&&o.loc===me.loc).length>=c.n;
  case'exactOneOtherAtMe':return me&&me.loc!=='base'&&at(me.loc).filter(u=>u.ctrl===pi&&u.iid!==me.iid).length===1;
  case'not':return!condOK(c.c,ctx);case'itNowMax':{const it=ctx.it&&obj(ctx.it[0]);return it&&might(it)<=c.n}
  case'anyEmp':return G.objs.some(o=>o.ctrl===pi&&o.emp);case'notDamaged':return me&&me.dmgTurn!==G.turn;case'fewerRunes':return P(pi).runes.length<P(opp(pi)).runes.length;
  case'swain':{const t=TS(pi);return t.pUnit&&t.pGear&&t.pSpell}case'notHand':return ctx.zone&&ctx.zone!=='hand';case'notInCombat':return!(me&&role(me));
  case'oppSpells':return(TS(opp(pi)).spells||0)>=c.n;
  case'notDiedAlone':return!ctx.diedAlone;case'anyDied':return(TS(0).died||0)+(TS(1).died||0)>0;case'fromHand':return!!ctx.fromHand;
  case'otherMight':return G.objs.filter(o=>o.kind==='unit'&&o.ctrl===pi&&o.iid!==ctx.src).reduce((a,o)=>a+might(o),0)>=c.n;
  case'oppStunned':return G.objs.some(o=>o.ctrl!==pi&&o.stun);
  case'attackWithOther':return me&&role(me)==='att'&&at(me.loc).filter(u=>u.ctrl===me.ctrl).length>1;

// ---------- deck builder ----------
function cardCost(c){return c.e??0}
function addReason(d,c){const L=BYID[d.legend];if(!L)return'Choose a champion first.';const tag=legendTag(L);

  if(c.t==='Battlefield'){if(d.bfs.includes(c.i)||d.bfs.some(i=>BYID[i].n===c.n))return'Each battlefield can only be included once.';if(d.bfs.length>=3)return'You already have 3 battlefields.';return null}

  if(!isDeckable(c))return`${c.t} cards can't go in the main deck.`;
  const all=d.champion?[d.champion,...d.main]:d.main;const copies=all.filter(i=>BYID[i].full===c.full).length;if(copies>=3)return`You already have 3 copies of ${c.n}.`;
  if(isSig(c)){if(!(c.g||[]).includes(tag))return`${c.n} is a Signature card for another champion.`;if(all.filter(i=>isSig(BYID[i])).length>=3)return'You already have 3 Signature cards.'}
  return null}
function addCard(d,cid){const c=BYID[cid];const r=addReason(d,c);if(r){toast(r);return false}const L=BYID[d.legend];
  if(c.t==='Battlefield'){d.bfs.push(cid);return true}
  if(c.t==='Rune'){const k=c.d[0];d.runes[k]=(d.runes[k]||0)+1;return true}
  if(!d.champion&&isChamp(c)&&(c.g||[]).includes(legendTag(L))){d.champion=cid;toast(`${c.full} is your Chosen Champion.`);return true}
  d.main.push(cid);return true}
function removeCard(d,cid){const c=BYID[cid];if(c.t==='Battlefield'){d.bfs=d.bfs.filter(i=>i!==cid);return}if(c.t==='Rune'){const k=c.d[0];if(d.runes[k])d.runes[k]--;return}
  const ix=d.main.lastIndexOf(cid);if(ix>=0){d.main.splice(ix,1);return}
  if(d.champion===cid){const j=d.main.indexOf(cid);if(j>=0){d.main.splice(j,1)}else d.champion=null;return}toast(`${c.n} isn't in your deck.`)}
function libCards(d){const L=BYID[d.legend];const q=LIB.q.toLowerCase();
  let list=CARDS.filter(c=>!(c.st||[]).includes('Token')&&c.t!=='Legend'&&(c.t!=='Rune'||c.full)&&(isDeckable(c)||c.t==='Battlefield'||c.t==='Rune'));
  const seenRune=new Set();list=list.filter(c=>{if(c.t!=='Rune')return true;const k=c.d[0];if(seenRune.has(k))return false;seenRune.add(k);return true});
  if(LIB.legalOnly&&L)list=list.filter(c=>inIdentity(c,L.d)&&!(isSig(c)&&!(c.g||[]).includes(legendTag(L))));
  if(LIB.type!=='All')list=list.filter(c=>LIB.type==='Champion'?isChamp(c):LIB.type==='Signature'?isSig(c):c.t===LIB.type);
  if(LIB.dom!=='All')list=list.filter(c=>c.d.includes(LIB.dom));
  if(LIB.cost!=='All')list=list.filter(c=>LIB.cost==='7+'?cardCost(c)>=7:cardCost(c)===+LIB.cost);
  if(LIB.set!=='All')list=list.filter(c=>c.i.startsWith(LIB.set+'-'));
  if(q)list=list.filter(c=>(c.full+' '+(c.g||[]).join(' ')+' '+c.x).toLowerCase().includes(q));
  const tOrd={Unit:0,Spell:1,Gear:2,Battlefield:3,Rune:4};
  const grp=c=>c.t==='Battlefield'?1:c.t==='Rune'?2:0;const s0={cost:(a,b)=>cardCost(a)-cardCost(b)||a.n.localeCompare(b.n),name:(a,b)=>a.n.localeCompare(b.n),type:(a,b)=>tOrd[a.t]-tOrd[b.t]||cardCost(a)-cardCost(b),might:(a,b)=>(b.m??-1)-(a.m??-1)||cardCost(a)-cardCost(b),power:(a,b)=>(b.p||0)-(a.p||0)||cardCost(a)-cardCost(b),set:(a,b)=>a.i.localeCompare(b.i,undefined,{numeric:true})}[LIB.sort];const s=(a,b)=>grp(a)-grp(b)||s0(a,b);
  return list.sort(s)}
function inDeckN(d,c){if(c.t==='Battlefield')return d.bfs.includes(c.i)?1:0;if(c.t==='Rune')return d.runes[c.d[0]]||0;return d.main.filter(i=>i===c.i).length+(d.champion===c.i?1:0)}

   <aside class="deckcol"><div class="dsum"><div><b class="${deckCount(d)>=40?'ok':''}">${deckCount(d)}</b><span>/ 40 main</span></div><div><b class="${d.bfs.length===3?'ok':''}">${d.bfs.length}</b><span>/ 3 fields</span></div><div><b class="${rn===12?'ok':''}">${rn}</b><span>/ 12 runes</span></div></div>

// ---------- events ----------
function lobbyEvent(e){const t=e.target.closest('[data-b],[data-a]');if(!t)return;
  if(t.dataset.a){const a=t.dataset.a,pi=+t.dataset.p;
    if(a==='pick'&&e.type==='click'){PICKP=pi;PICKSEL=DECKS[pi]&&DECKS[pi].legend||null;screen='pick';render();return}
    if(a==='build'&&e.type==='click'){BUILDP=pi;screen='build';render();return}
    return setupEvent(e)}
  const b=t.dataset.b,v=t.dataset.v;
  if(screen==='pick'){
    if(b==='back'&&e.type==='click'){screen='setup';render();return}
    if(b==='pdom'&&e.type==='click'){PICKDOM=v;render();return}
    if(b==='psel'&&e.type==='click'){PICKSEL=v;render();return}
    if(b==='lock'&&e.type==='click'){const d=DECKS[PICKP];if(!d||d.legend!==PICKSEL){const old=d;DECKS[PICKP]=emptyDeck(PICKSEL);if(old&&old.legend){const nd=DECKS[PICKP];[...(old.champion?[old.champion]:[]),...old.main].forEach(i=>{if(!addReason(nd,BYID[i]))addCard(nd,i)});old.bfs.forEach(i=>{if(!addReason(nd,BYID[i]))nd.bfs.push(i)});toast('Kept every card that fits the new champion.')}}BUILDP=PICKP;screen='build';render();return}
    return}
  if(screen==='build'){const d=DECKS[BUILDP];
    if(e.type==='contextmenu'){const el=t.closest('[data-b="lib"],[data-b="dl"]');if(el){e.preventDefault();removeCard(d,el.dataset.v);render()}return}
    if(e.type==='click'){
      if(b==='lib'||b==='dl'){if(addCard(d,v))render();else{t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake')}return}
      if(b==='f'){LIB[t.dataset.k2]=v;render();return}
      if(b==='rune+'){const n=Object.values(d.runes).reduce((a,c)=>a+c,0);if(n>=12)return toast('The rune deck is full (12 runes).');d.runes[v]=(d.runes[v]||0)+1;render();return}
      if(b==='rune-'){if(d.runes[v])d.runes[v]--;render();return}
      if(b==='rand'){DECKS[BUILDP]=randomDeck(d.legend);render();return}
      if(b==='clear'){DECKS[BUILDP]=emptyDeck(d.legend);render();return}
      if(b==='save'){const name=prompt('Name this deck',champName(BYID[d.legend]));if(!name)return;const s=loadSaved();s[name]=d;storeSaved(s);toast(`Saved "${name}".`);return}
      if(b==='done'){screen='setup';render();return}
      if(b==='text'){dialog(`<header class="zhead"><h3>Import / export</h3><p class="hint">Paste a list with Legend, Champion, Main Deck, Battlefields and Runes sections, or copy this one.</p></header><textarea id="dtext" rows="18" spellcheck="false">${esc(deckToText(d))}</textarea><div class="row"><button class="go" data-d="imp">Import list</button><button data-d="copy">Copy</button></div>`,(x,dl)=>{const ta=document.getElementById('dtext');
          if(x.dataset.d==='copy'){navigator.clipboard&&navigator.clipboard.writeText(ta.value);toast('Copied.');return}
          if(x.dataset.d==='imp'){const r=parseDeckText(ta.value);const L=r.legend||d.legend;const nd=emptyDeck(L);let rej=0;
            [...(r.champion?[r.champion]:[]),...r.main].forEach(i=>{if(addReason(nd,BYID[i]))rej++;else addCard(nd,i)});r.bfs.forEach(i=>{if(addReason(nd,BYID[i]))rej++;else nd.bfs.push(i)});if(Object.keys(r.runes).length){nd.runes={};Object.entries(r.runes).forEach(([k,n])=>{if(BYID[L].d.includes(k))nd.runes[k]=Math.min(n,12)})}
            DECKS[BUILDP]=nd;dl.close();render();toast([r.errors.length?r.errors.length+' names not found':'',rej?rej+' cards rejected by deck rules':''].filter(Boolean).join(' · ')||'List imported.')}});return}}
    return}}
document.addEventListener('input',e=>{const t=e.target;if(screen==='pick'&&t.dataset.b==='pq'){PICKQ=t.value.toLowerCase();const pos=t.selectionStart;render();const n=document.querySelector('[data-b="pq"]');if(n){n.focus();n.setSelectionRange(pos,pos)}}
  if(screen==='build'&&t.dataset.b==='q'){LIB.q=t.value;clearTimeout(window._lq);window._lq=setTimeout(()=>{const pos=t.selectionStart;render();const n=document.querySelector('[data-b="q"]');if(n){n.focus();n.setSelectionRange(pos,pos)}},140)}});
document.addEventListener('change',e=>{const t=e.target;if(screen!=='build')return;if(t.dataset.b==='sort'){LIB.sort=t.value;render()}else if(t.dataset.b==='set'){LIB.set=t.value;render()}else if(t.dataset.b==='legal'){LIB.legalOnly=t.checked;render()}});
document.addEventListener('contextmenu',e=>{if(screen==='build'||screen==='pick')lobbyEvent(e)});
</script></body></html>
